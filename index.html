<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080C14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VaultCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C14;--bg2:#111827;--bg3:#1C2536;--bg4:#242F45;
  --v:#6D5FFD;--vl:#8B7FFF;--vd:#4C3FD4;
  --em:#0ECB81;--am:#F0B429;--co:#F05252;--bl:#3B9EFF;
  --text:#EAECF4;--t2:#8892A4;--t3:#4E5A6E;
  --bd:#1E2A3D;--tab:64px;--ff:'Inter',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ff);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--tab)+12px);scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

.topbar{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.tbar-title{font-size:20px;font-weight:800;letter-spacing:-0.4px;cursor:pointer;user-select:none}
.tbar-title em{color:var(--vl);font-style:normal}
.tbar-actions{display:flex;gap:8px}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);font-size:16px;transition:.15s;flex-shrink:0}
.ibtn:hover{background:var(--bg4);color:var(--text)}

#tabbar{height:var(--tab);display:flex;background:rgba(8,12,20,.96);backdrop-filter:blur(16px);border-top:1px solid var(--bd);position:relative;z-index:20;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--t3);font-size:10px;font-family:var(--ff);font-weight:600;letter-spacing:.02em;padding:6px 2px;transition:.15s;position:relative}
.tab-ic{font-size:19px;line-height:1;transition:.15s}
.tab.active{color:var(--vl)}
.tab.active .tab-ic{filter:drop-shadow(0 0 8px rgba(109,95,253,.7))}
.notif{width:6px;height:6px;background:var(--co);border-radius:50%;position:absolute;top:8px;right:calc(50% - 14px)}

.slabel{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.08em;padding:18px 18px 8px;text-transform:uppercase}

/* ── HORIZONTAL CARD SCROLL ─────────────────────────────────────────── */
.card-scroll{display:flex;gap:14px;padding:2px 18px 18px;overflow-x:auto;scrollbar-width:none}
.card-scroll::-webkit-scrollbar{display:none}
.bcard{min-width:295px;height:170px;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden;flex-shrink:0;transition:transform .2s;border:1px solid rgba(255,255,255,.06)}
.bcard:active{transform:scale(.98)}
.bcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:17px}
.bcard-overlay{position:absolute;inset:0;border-radius:17px}
.bcard-content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;justify-content:space-between}
.bcard-bank{font-size:12px;font-weight:700;opacity:.8;letter-spacing:.04em}
.bcard-type{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;margin-top:3px;width:fit-content}
.bcard-digits{font-size:16px;font-weight:700;letter-spacing:.14em}
.bcard-bottom{display:flex;justify-content:space-between;align-items:flex-end}
.bcard-id{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.06em}
.bcard-id span{display:block;font-size:12px;font-weight:700;opacity:1;margin-top:2px}
.bcard-badge{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.add-bcard{min-width:295px;height:170px;border-radius:18px;border:2px dashed var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--t3);flex-shrink:0;transition:.2s}
.add-bcard:hover{border-color:var(--v);color:var(--vl);background:rgba(109,95,253,.04)}
.add-bcard-plus{font-size:28px}

.offer-list{padding:0 18px;display:flex;flex-direction:column;gap:8px}
.offer-item{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.offer-item:active{background:var(--bg3)}
.offer-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.s-available::before{background:var(--em)}
.s-redeemed::before{background:var(--am)}
.s-used::before{background:var(--v)}
.s-sold::before{background:var(--bl)}
.s-skipped::before{background:var(--t3)}
.offer-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.offer-info{flex:1;min-width:0}
.offer-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer-sub{font-size:11px;color:var(--t2);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.offer-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.02em}
.chip-available{background:rgba(14,203,129,.12);color:#34D399;border:1px solid rgba(14,203,129,.25)}
.chip-redeemed{background:rgba(240,180,41,.12);color:#FCD34D;border:1px solid rgba(240,180,41,.25)}
.chip-used{background:rgba(109,95,253,.12);color:var(--vl);border:1px solid rgba(109,95,253,.25)}
.chip-sold{background:rgba(59,158,255,.12);color:#93C5FD;border:1px solid rgba(59,158,255,.25)}
.chip-skipped{background:rgba(78,90,110,.12);color:var(--t2);border:1px solid var(--bd)}
.chip-paused{background:rgba(240,82,82,.12);color:#FCA5A5;border:1px solid rgba(240,82,82,.25)}
.chip-ended{background:rgba(78,90,110,.12);color:var(--t2);border:1px solid var(--bd)}
.offer-date{font-size:10px;color:var(--t3)}
.offer-urgent{color:var(--co);font-size:10px;font-weight:700;margin-top:1px}
.offer-paused-banner{background:rgba(240,82,82,.08);border:1px solid rgba(240,82,82,.2);border-radius:8px;padding:6px 10px;font-size:11px;color:#FCA5A5;margin-top:6px;width:100%}
.offer-ended-banner{background:rgba(78,90,110,.08);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--t2);margin-top:6px;width:100%}

.cat-scroll{display:flex;gap:6px;padding:2px 18px 14px;overflow-x:auto;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cpill{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--bg2);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.cpill.active{background:rgba(109,95,253,.2);border-color:var(--v);color:var(--vl)}

.tgl-group{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px;margin:0 18px 14px}
.tgl-opt{flex:1;padding:7px;border-radius:7px;border:none;background:none;color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:.15s;text-align:center;white-space:nowrap}
.tgl-opt.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* UPCOMING TIMELINE */
.tl-wrap{padding:0 18px}
.tl-group{margin-bottom:22px}
.tl-month{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.07em;padding:4px 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.tl-month::after{content:'';flex:1;height:1px;background:var(--bd)}
.tl-item{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.tl-item:active{background:var(--bg3)}
.tl-item.tl-soon{border-color:rgba(109,95,253,.35);background:rgba(109,95,253,.05)}
.tl-ic{font-size:17px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg3);flex-shrink:0}
.tl-info{flex:1;min-width:0}
.tl-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card{font-size:11px;color:var(--t2);margin-top:1px}
.tl-status{margin-top:3px}
.tl-right{text-align:right;flex-shrink:0}
.tl-cycle-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-bottom:3px}
.cy-q{background:rgba(14,203,129,.12);color:#34D399}
.cy-h{background:rgba(240,180,41,.12);color:#FCD34D}
.cy-y{background:rgba(109,95,253,.12);color:var(--vl)}
.cy-m{background:rgba(59,158,255,.12);color:#93C5FD}
.tl-days{font-size:10px;color:var(--t3);margin-top:2px}
.tl-days.soon{color:var(--vl);font-weight:700}
.tl-paused-row{background:rgba(240,82,82,.05);border:1px solid rgba(240,82,82,.15);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.tl-ended-row{opacity:.45;border:1px dashed var(--bd);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}

/* OVERLAY / SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;max-width:430px;margin:0 auto}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-height:93vh;overflow-y:auto;padding-bottom:32px;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.overlay.open .sheet{transform:translateY(0)}
.sheet::-webkit-scrollbar{display:none}
.sheet-handle{width:32px;height:3px;background:var(--bd);border-radius:3px;margin:10px auto 0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px}
.sheet-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:none;color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sbody{padding:0 18px}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.05em;margin-bottom:5px;text-transform:uppercase}
.finput{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;font-family:var(--ff);outline:none;transition:.15s;-webkit-appearance:none;color-scheme:dark}
.finput:focus{border-color:var(--v)}
.finput::placeholder{color:var(--t3)}
.fselect{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;font-family:var(--ff);outline:none;cursor:pointer;-webkit-appearance:none;color-scheme:dark}
.fselect:focus{border-color:var(--v)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4}

.img-up{width:100%;height:130px;border:2px dashed var(--bd);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--t3);position:relative;overflow:hidden;transition:.2s}
.img-up:hover{border-color:var(--v);color:var(--vl)}
.img-up input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.img-up .iup-lbl{position:relative;z-index:1;font-size:12px;font-weight:600;pointer-events:none}
.img-up .iup-ic{font-size:24px;pointer-events:none}
.img-rm{position:absolute;top:7px;right:7px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.cpresets{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.cpreset{width:36px;height:36px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.15s;position:relative;flex-shrink:0}
.cpreset.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:10px;border:1px solid var(--bd);background:var(--bg3);cursor:pointer;transition:.15s}
.cat-opt:hover{background:var(--bg4)}
.cat-opt.sel{background:rgba(109,95,253,.15);border-color:var(--v)}
.cat-opt .cem{font-size:20px;line-height:1}
.cat-opt .cnm{font-size:9px;color:var(--t2);font-weight:600;text-align:center;line-height:1.2}

.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;font-family:var(--ff);cursor:pointer;transition:.15s;letter-spacing:-.1px}
.btn-p{background:linear-gradient(135deg,var(--vd),var(--vl));color:#fff}
.btn-p:hover{opacity:.9}
.btn-s{background:var(--bg3);color:var(--t2);border:1px solid var(--bd)}
.btn-s:hover{color:var(--text);background:var(--bg4)}
.btn-d{background:rgba(240,82,82,.1);color:var(--co);border:1px solid rgba(240,82,82,.25)}
.btn-am{background:rgba(240,180,41,.1);color:var(--am);border:1px solid rgba(240,180,41,.25)}
.btn-gap{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.btn-row{display:flex;gap:9px}
.btn-row .btn{font-size:13px;padding:11px}

/* CORRECT STATUS BUTTONS */
.correct-bar{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.correct-bar-label{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.correct-btns{display:flex;gap:6px;flex-wrap:wrap}
.correct-btn{padding:5px 12px;border-radius:20px;border:1px solid;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff);background:transparent;transition:.15s}
.cb-available{border-color:rgba(14,203,129,.4);color:#34D399}
.cb-available:hover{background:rgba(14,203,129,.1)}
.cb-redeemed{border-color:rgba(240,180,41,.4);color:#FCD34D}
.cb-redeemed:hover{background:rgba(240,180,41,.1)}
.cb-used{border-color:rgba(109,95,253,.4);color:var(--vl)}
.cb-used:hover{background:rgba(109,95,253,.1)}
.cb-sold{border-color:rgba(59,158,255,.4);color:#93C5FD}
.cb-sold:hover{background:rgba(59,158,255,.1)}
.cb-skipped{border-color:var(--bd);color:var(--t2)}
.cb-skipped:hover{background:rgba(78,90,110,.1)}

.drow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--bd)}
.drow:last-child{border-bottom:none}
.dkey{font-size:12px;color:var(--t2)}
.dval{font-size:13px;font-weight:700;text-align:right;max-width:60%}

.dl-bar{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.dl-label{font-size:11px;color:var(--t2);margin-bottom:7px;font-weight:600}
.dl-track{height:5px;background:var(--bd);border-radius:5px;overflow:hidden}
.dl-fill{height:100%;border-radius:5px;transition:width .5s}
.dl-nums{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:5px}

.hist-item{background:var(--bg3);border-radius:9px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.hist-cycle{font-size:12px;font-weight:700}
.hist-right{display:flex;align-items:center;gap:8px}
.hist-date{font-size:11px;color:var(--t3)}

.lc-ctrl{border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid}
.lc-active-ctrl{background:rgba(14,203,129,.05);border-color:rgba(14,203,129,.2)}
.lc-paused-ctrl{background:rgba(240,82,82,.05);border-color:rgba(240,82,82,.2)}
.lc-ended-ctrl{background:rgba(78,90,110,.05);border-color:var(--bd)}
.lc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.lc-sub{font-size:12px;color:var(--t2);margin-bottom:10px}
.lc-btns{display:flex;gap:8px;flex-wrap:wrap}
.lc-btn{padding:6px 14px;border-radius:8px;border:1px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff);transition:.15s;background:transparent}
.lc-btn-pause{border-color:rgba(240,180,41,.4);color:var(--am)}
.lc-btn-pause:hover{background:rgba(240,180,41,.1)}
.lc-btn-end{border-color:rgba(240,82,82,.4);color:var(--co)}
.lc-btn-end:hover{background:rgba(240,82,82,.1)}
.lc-btn-resume{border-color:rgba(14,203,129,.4);color:var(--em)}
.lc-btn-resume:hover{background:rgba(14,203,129,.1)}

.mini-card-hdr{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg3);border-radius:12px;margin-bottom:14px}
.mini-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.rdm-hero{text-align:center;padding:18px 18px 16px}
.rdm-em{font-size:46px;margin-bottom:6px}
.rdm-title{font-size:18px;font-weight:800;margin-bottom:3px}
.rdm-sub{font-size:13px;color:var(--t2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:52px 36px;text-align:center}
.empty .ei{font-size:42px}
.empty .et{font-size:17px;font-weight:700}
.empty .es{font-size:13px;color:var(--t2);line-height:1.6}

.div{height:1px;background:var(--bd);margin:14px 0}

.info-box{border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:12px;line-height:1.5}
.info-am{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.2);color:#FCD34D}
.info-em{background:rgba(14,203,129,.08);border:1px solid rgba(14,203,129,.2);color:#34D399}
.info-co{background:rgba(240,82,82,.08);border:1px solid rgba(240,82,82,.2);color:#FCA5A5}

/* EXPORT/IMPORT MENU */
.menu-overlay{position:fixed;inset:0;z-index:200;display:none;max-width:430px;margin:0 auto}
.menu-overlay.open{display:block}
.menu-backdrop{position:absolute;inset:0}
.menu-box{position:absolute;top:60px;left:18px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:200px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;border:none;background:none;color:var(--text);font-family:var(--ff);width:100%;text-align:left}
.menu-item:hover{background:var(--bg3)}
.menu-item .mi-ic{font-size:18px;width:28px;text-align:center}
.menu-sep{height:1px;background:var(--bd);margin:4px 0}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fadeUp .2s ease forwards}

@media(min-width:430px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <nav id="tabbar">
    <button class="tab active" data-tab="cards" onclick="switchTab('cards')"><span class="tab-ic">💳</span>Cards</button>
    <button class="tab" data-tab="available" onclick="switchTab('available')"><span class="tab-ic">🎁</span>Available</button>
    <button class="tab" data-tab="redeemed" onclick="switchTab('redeemed')"><span class="tab-ic">✅</span>Redeemed</button>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────
const CATS=[
  {id:'spa',l:'Spa',e:'🧖'},{id:'golf',l:'Golf',e:'⛳'},
  {id:'ott',l:'OTT',e:'🎬'},{id:'health',l:'Health',e:'🏥'},
  {id:'gym',l:'Gym',e:'💪'},{id:'shopping',l:'Shopping',e:'🛍️'},
  {id:'food',l:'Food',e:'🍽️'},{id:'music',l:'Music',e:'🎵'},
  {id:'entertainment',l:'Fun',e:'🎭'},{id:'pharmacy',l:'Pharmacy',e:'💊'},
  {id:'lounge',l:'Lounge',e:'✈️'},{id:'groceries',l:'Groceries',e:'🛒'},
  {id:'cab',l:'Cab',e:'🚕'},{id:'more',l:'More',e:'⭐'},
];
const CARD_GRADS=[
  {g:'linear-gradient(135deg,#1a0533,#3d0d6e)',c:'#7C3AED'},
  {g:'linear-gradient(135deg,#0d1f1a,#0d3d2a)',c:'#0ECB81'},
  {g:'linear-gradient(135deg,#1a1200,#3d2e00)',c:'#F0B429'},
  {g:'linear-gradient(135deg,#1a0a00,#4a1a00)',c:'#F05252'},
  {g:'linear-gradient(135deg,#001a3a,#003480)',c:'#3B9EFF'},
  {g:'linear-gradient(135deg,#1a001a,#3d003d)',c:'#EC4899'},
  {g:'linear-gradient(135deg,#001a2a,#003d55)',c:'#06B6D4'},
  {g:'linear-gradient(135deg,#1a1a00,#3d3500)',c:'#84CC16'},
];
const CYCLES=[{v:1,l:'Monthly'},{v:3,l:'Quarterly'},{v:6,l:'Half-yearly'},{v:12,l:'Yearly'}];
const STATUS_LABELS={available:'Available',redeemed:'Redeemed',used:'Used',sold:'Sold',skipped:'Skipped'};
const ALL_STATUSES=['available','redeemed','used','sold','skipped'];

// ── HELPERS ───────────────────────────────────────────────────────────────
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const cat=id=>CATS.find(x=>x.id===id)||{e:'⭐',l:id};
const cycleL=v=>CYCLES.find(x=>x.v===v)?.l||v+'m';
const fmtD=d=>{if(!d)return'—';const[y,m,dy]=d.split('-').map(Number);return new Date(y,m-1,dy).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
const daysUntil=d=>{if(!d)return null;const[y,m,dy]=d.split('-').map(Number);const t=new Date(y,m-1,dy);const n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-n)/(864e5))};
const hexRgb=h=>{const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#6D5FFD');return r?`${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}`:'109,95,253'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ── CYCLE MATH — TIMEZONE SAFE (pure arithmetic, no toISOString) ──────────
function padDate(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

function cycleStartFor(cycleMonths,refDateStr){
  // Parse ref date (or today) without creating a UTC date
  const ref=refDateStr||todayStr();
  const[ry,rm,rd]=ref.split('-').map(Number);
  const m=rm-1; // zero-based month
  if(cycleMonths===1) return padDate(ry,rm,1);
  if(cycleMonths===3){const q=Math.floor(m/3);return padDate(ry,q*3+1,1);}
  if(cycleMonths===6){return m<6?padDate(ry,1,1):padDate(ry,7,1);}
  return padDate(ry,1,1); // yearly
}

// KEY FIX: pure arithmetic — no Date object, no UTC conversion
function cycleEndFor(cycleMonths,cycleStart){
  const[y,m,d]=cycleStart.split('-').map(Number);
  let totalMonths=(m-1)+cycleMonths;
  const newYear=y+Math.floor(totalMonths/12);
  const newMonth=(totalMonths%12)+1;
  return padDate(newYear,newMonth,d);
}

function cycleLabel(cycleMonths,cycleStart){
  const[y,m]=cycleStart.split('-').map(Number);
  if(cycleMonths===1){const mn=new Date(y,m-1,1).toLocaleString('default',{month:'short'});return`${mn} ${y}`;}
  if(cycleMonths===3){const q=Math.ceil(m/3);return`Q${q} ${y}`;}
  if(cycleMonths===6){return m<=6?`H1 ${y}`:`H2 ${y}`;}
  return`${y}`;
}

// Returns all future cycle starts within 'months' window from today
function futureCycleStarts(cycleMonths, windowMonths){
  const starts=[];
  const today=todayStr();
  // Current cycle end = first future reset
  const cs=cycleStartFor(cycleMonths);
  let nextStart=cycleEndFor(cycleMonths,cs);
  // Calculate window end
  const[ty,tm]=today.split('-').map(Number);
  let wEndM=tm-1+windowMonths;
  const wEndY=ty+Math.floor(wEndM/12);
  wEndM=(wEndM%12)+1;
  const windowEnd=padDate(wEndY,wEndM,1);
  while(nextStart<windowEnd){
    starts.push(nextStart);
    const ce=cycleEndFor(cycleMonths,nextStart);
    nextStart=ce;
  }
  return starts;
}

function getNextResetDate(offer){
  const cs=cycleStartFor(offer.cycle);
  return cycleEndFor(offer.cycle,cs);
}

function getCurrentCycleStart(offer){return cycleStartFor(offer.cycle);}

function ensureCurrentInstance(offer){
  if(offer.lifecycle!=='active')return null;
  const cs=getCurrentCycleStart(offer);
  const ce=cycleEndFor(offer.cycle,cs);
  const lbl=cycleLabel(offer.cycle,cs);
  let inst=offer.instances.find(i=>i.cycleStart===cs);
  if(!inst){
    inst={id:uid(),offerId:offer.id,cycleStart:cs,cycleEnd:ce,cycleLabel:lbl,status:'available',redeemDate:null,useByDate:null,notes:''};
    offer.instances.push(inst);
  }
  return inst;
}
function getCurrentInstance(offer){
  const cs=getCurrentCycleStart(offer);
  return offer.instances.find(i=>i.cycleStart===cs)||null;
}

// ── STATE ─────────────────────────────────────────────────────────────────
// ── CLOUD CONFIG ───────────────────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbzhKZ663U9vCjpLkrLrhi0OfVB5oP_w-MSrrlVk1mma02oe9yDh7uKM3aeePtvUrTHx/exec';
const API_PIN = '0409';

let S={tab:'cards',cards:[],offers:[],_selCat:null,_tradeable:false,_newCardImg:null,_selGrad:0,_offerCardId:null,_upcomingWindow:3};

// ── LOCAL SAVE (instant) + CLOUD SAVE (background) ────────────────────────
function save(){
  try{localStorage.setItem('vc3',JSON.stringify({cards:S.cards,offers:S.offers}));}catch(e){}
  cloudSave();
}

// FIX #5: proper Content-Type header so Apps Script can parse the POST body
async function cloudSave(){
  try{
    await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:API_PIN,action:'SAVE',payload:{cards:S.cards,offers:S.offers}})
    });
  }catch(e){/* silent — local copy is safe */}
}

// FIX #4: script ends with load() not render() — load() calls render() itself
async function load(){
  // 1. Load local immediately so app feels instant
  try{
    const local=JSON.parse(localStorage.getItem('vc3')||'null');
    if(local&&local.cards){S.cards=local.cards;S.offers=local.offers||[];}
  }catch(e){}
  S.offers.forEach(o=>ensureCurrentInstance(o));
  render(); // show local data right away

  // 2. Then fetch cloud in background and refresh if newer
  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:API_PIN,action:'LOAD',payload:{}})
    });
    const json=await res.json();
    if(json.ok&&json.data&&json.data.cards){
      S.cards=json.data.cards||[];
      S.offers=json.data.offers||[];
      localStorage.setItem('vc3',JSON.stringify({cards:S.cards,offers:S.offers}));
      S.offers.forEach(o=>ensureCurrentInstance(o));
      render(); // refresh with cloud data
    }
  }catch(e){/* offline — local data already shown */}
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const v=document.getElementById('view');
  if(S.tab==='cards') v.innerHTML=renderCards();
  else if(S.tab==='available') v.innerHTML=renderAvailable();
  else if(S.tab==='redeemed') v.innerHTML=renderRedeemed();
  else if(S.tab==='upcoming') v.innerHTML=renderUpcoming();
  updateNotifDot();
}
function updateNotifDot(){
  const dot=document.getElementById('notif-dot');
  const soon=S.offers.filter(o=>o.lifecycle==='active').some(o=>{
    const d=daysUntil(getNextResetDate(o));return d!==null&&d<=7&&d>0;
  });
  dot.style.display=soon?'block':'none';
}

// ── CARDS TAB ──────────────────────────────────────────────────────────────
function renderCards(){
  const cardHTMLs=S.cards.map(c=>{
    const cos=S.offers.filter(o=>o.cardId===c.id);
    const avail=cos.filter(o=>{if(o.lifecycle!=='active')return false;const i=getCurrentInstance(o);return i&&i.status==='available';}).length;
    const total=cos.filter(o=>o.lifecycle!=='ended').length;
    const gr=CARD_GRADS[c.grad||0];
    return`<div class="bcard" style="background:${gr.g}" onclick="openCardDetail('${c.id}')">
      ${c.image?`<img class="bcard-img" src="${c.image}" alt=""><div class="bcard-overlay" style="background:linear-gradient(135deg,rgba(0,0,0,.5),rgba(0,0,0,.2))"></div>`:''}
      <div class="bcard-content">
        <div><div class="bcard-bank">${c.bank}</div><div class="bcard-type">${c.type==='Credit'?'💳':'🏦'} ${c.type}</div></div>
        <div>
          <div class="bcard-digits">●●●● ●●●● ●●●● ${c.last4}</div>
          <div class="bcard-bottom" style="margin-top:9px">
            <div class="bcard-id">Card ref<span>${c.first6}••••${c.last4}</span></div>
            <div class="bcard-badge">${avail}/${total} active</div>
          </div>
        </div>
      </div></div>`;
  }).join('');
  return`<div class="topbar">
    <div class="tbar-title" onclick="toggleMenu()">Vault<em>Card</em> ▾</div>
    <div class="tbar-actions"><button class="ibtn" onclick="openAddCard()">＋</button></div></div>
    <div class="slabel">My Cards</div>
    <div class="card-scroll">${cardHTMLs}<div class="add-bcard" onclick="openAddCard()"><div class="add-bcard-plus">＋</div><div style="font-size:12px;font-weight:600">Add Card</div></div></div>
    <div class="slabel">All Offers</div>
    <div class="cat-scroll" id="all-cats">
      <div class="cpill active" data-c="all" onclick="filterAllCat('all')">🗂 All</div>
      ${CATS.map(c=>`<div class="cpill" data-c="${c.id}" onclick="filterAllCat('${c.id}')">${c.e} ${c.l}</div>`).join('')}
    </div>
    <div class="offer-list ani" id="all-offer-list">
      ${S.offers.map(o=>renderOfferItem(o,S.cards.find(c=>c.id===o.cardId),'all')).join('')||emptyHTML('🗂️','No offers yet','Add offers after creating a card.')}
    </div><div style="height:16px"></div>`;
}

// ── OFFER ITEM ─────────────────────────────────────────────────────────────
function renderOfferItem(o,card,mode){
  const ci=cat(o.cat);
  const gr=CARD_GRADS[card?.grad||0];
  const inst=getCurrentInstance(o);
  if(o.lifecycle==='ended'){
    return`<div class="offer-item s-skipped" onclick="openOfferDetail('${o.id}')">
      <div class="offer-ic" style="background:rgba(78,90,110,.12)">${ci.e}</div>
      <div class="offer-info"><div class="offer-name" style="opacity:.5">${o.name}</div>
        <div class="offer-sub">${mode!=='card'?(card?.bank||'')+'  · ':''} ${cycleL(o.cycle)}</div>
        <div class="offer-ended-banner">🔴 Discontinued${o.lcNote?' — '+o.lcNote:''}</div></div>
      <div class="offer-right"><span class="chip chip-ended">Ended</span></div></div>`;
  }
  if(o.lifecycle==='paused'){
    return`<div class="offer-item s-skipped" onclick="openOfferDetail('${o.id}')">
      <div class="offer-ic" style="background:rgba(109,95,253,.12)">${ci.e}</div>
      <div class="offer-info"><div class="offer-name">${o.name}</div>
        <div class="offer-sub">${mode!=='card'?(card?.bank||'')+'  · ':''} ${cycleL(o.cycle)}</div>
        <div class="offer-paused-banner">⏸ Paused by bank${o.lcNote?' — '+o.lcNote:''}</div></div>
      <div class="offer-right"><span class="chip chip-paused">Paused</span></div></div>`;
  }
  if(!inst)return'';
  const urgent=inst.status==='redeemed'&&daysUntil(inst.useByDate)!==null&&daysUntil(inst.useByDate)<=7;
  const nextReset=getNextResetDate(o);
  const dtr=daysUntil(nextReset);
  return`<div class="offer-item s-${inst.status} ani" onclick="openOfferDetail('${o.id}')">
    <div class="offer-ic" style="background:rgba(${hexRgb(gr.c)},.12)">${ci.e}</div>
    <div class="offer-info">
      <div class="offer-name">${o.name}</div>
      <div class="offer-sub">${mode!=='card'?`<span style="color:var(--t3)">${card?.bank||''}</span> · `:''} ${cycleL(o.cycle)} · ${cycleLabel(o.cycle,cycleStartFor(o.cycle))}${o.tradeable?' · <span style="color:var(--em);font-size:10px">Tradeable</span>':''}</div>
      ${urgent?`<div class="offer-urgent">⚠ Use by ${fmtD(inst.useByDate)}</div>`:''}
    </div>
    <div class="offer-right">
      <span class="chip chip-${inst.status}">${STATUS_LABELS[inst.status]}</span>
      <span class="offer-date">${instHint(inst,nextReset,dtr)}</span>
    </div></div>`;
}
function instHint(inst,nextReset,dtr){
  if(inst.status==='available')return dtr!==null&&dtr<=14?`Resets in ${dtr}d`:'';
  if(inst.status==='redeemed')return inst.useByDate?`Use by ${fmtD(inst.useByDate)}`:'';
  if(inst.status==='used'||inst.status==='sold')return nextReset?`Next ${fmtD(nextReset)}`:'';
  return'';
}

// ── AVAILABLE TAB ──────────────────────────────────────────────────────────
function renderAvailable(){
  const items=S.offers.filter(o=>o.lifecycle==='active').filter(o=>{const i=getCurrentInstance(o);return i&&i.status==='available';});
  const cats=[...new Set(items.map(x=>x.cat))];
  return`<div class="topbar"><div class="tbar-title">Available <em>Offers</em></div></div>
    <div class="cat-scroll" id="av-cats">
      <div class="cpill active" data-c="all" onclick="filterAvailCat('all')">🗂 All</div>
      ${cats.map(id=>{const c=cat(id);return`<div class="cpill" data-c="${id}" onclick="filterAvailCat('${id}')">${c.e} ${c.l}</div>`}).join('')}
    </div>
    <div class="offer-list ani" id="av-list">
      ${items.map(o=>renderOfferItem(o,S.cards.find(c=>c.id===o.cardId),'avail')).join('')||emptyHTML('🎁','All redeemed!','No available offers right now. Check Upcoming for next reset dates.')}
    </div><div style="height:16px"></div>`;
}

// ── REDEEMED TAB ───────────────────────────────────────────────────────────
function renderRedeemed(){
  const items=S.offers.flatMap(o=>{
    const card=S.cards.find(c=>c.id===o.cardId);
    return o.instances.filter(i=>i.status!=='available').map(i=>({o,i,card}));
  }).sort((a,b)=>new Date(b.i.redeemDate||b.i.cycleStart)-new Date(a.i.redeemDate||a.i.cycleStart));
  return`<div class="topbar"><div class="tbar-title">Redeemed <em>History</em></div></div>
    <div class="tgl-group">
      <button class="tgl-opt active" data-sf="all" onclick="setRedFilter('all')">All</button>
      <button class="tgl-opt" data-sf="redeemed" onclick="setRedFilter('redeemed')">Redeemed</button>
      <button class="tgl-opt" data-sf="used" onclick="setRedFilter('used')">Used</button>
      <button class="tgl-opt" data-sf="sold" onclick="setRedFilter('sold')">Sold</button>
      <button class="tgl-opt" data-sf="skipped" onclick="setRedFilter('skipped')">Skipped</button>
    </div>
    <div class="offer-list ani" id="red-list">${renderRedItems(items,'all')}</div>
    <div style="height:16px"></div>`;
}
function renderRedItems(items,sf){
  const f=sf==='all'?items:items.filter(x=>x.i.status===sf);
  if(!f.length)return emptyHTML('📋','Nothing here','Offers you redeem appear in this history.');
  return f.map(({o,i,card})=>{
    const ci=cat(o.cat);
    const urgent=i.status==='redeemed'&&daysUntil(i.useByDate)!==null&&daysUntil(i.useByDate)<=7;
    const nextReset=getNextResetDate(o);
    return`<div class="offer-item s-${i.status} ani">
      <div class="offer-ic" style="background:rgba(109,95,253,.1)">${ci.e}</div>
      <div class="offer-info" onclick="openOfferDetail('${o.id}')">
        <div class="offer-name">${o.name}</div>
        <div class="offer-sub"><span style="color:var(--t3)">${card?.bank||''}</span> · ${i.cycleLabel} · ${cycleL(o.cycle)}</div>
        ${urgent?`<div class="offer-urgent">⚠ Use by ${fmtD(i.useByDate)}</div>`:''}
      </div>
      <div class="offer-right">
        <span class="chip chip-${i.status}" style="cursor:pointer" onclick="openCorrectStatus('${o.id}','${i.id}')" title="Tap to correct">${STATUS_LABELS[i.status]} ✎</span>
        <span class="offer-date">${i.redeemDate?fmtD(i.redeemDate):''}</span>
        ${(i.status==='used'||i.status==='sold')&&nextReset?`<span class="offer-date" style="color:var(--em)">Next ${fmtD(nextReset)}</span>`:''}
      </div></div>`;
  }).join('');
}

// ── CORRECT STATUS SHEET ───────────────────────────────────────────────────
function openCorrectStatus(offerId,instanceId){
  const o=S.offers.find(x=>x.id===offerId);if(!o)return;
  const inst=o.instances.find(x=>x.id===instanceId);if(!inst)return;
  const ci=cat(o.cat);
  const card=S.cards.find(c=>c.id===o.cardId);
  openSheet(`
    <div class="sheet-hdr">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${ci.e}</span><div class="sheet-title">Correct Status</div></div>
      <button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sbody">
      <div class="mini-card-hdr">
        <div class="mini-dot" style="background:${CARD_GRADS[card?.grad||0].c}"></div>
        <div><div style="font-size:13px;font-weight:700">${o.name}</div>
        <div style="font-size:11px;color:var(--t2)">${card?.bank||''} · ${inst.cycleLabel}</div></div>
      </div>
      <div class="correct-bar">
        <div class="correct-bar-label">Current: <span class="chip chip-${inst.status}">${STATUS_LABELS[inst.status]}</span></div>
        <div style="font-size:12px;color:var(--t2);margin-bottom:10px">Select the correct status below:</div>
        <div class="correct-btns">
          ${ALL_STATUSES.filter(s=>s!==inst.status).map(s=>`<button class="correct-btn cb-${s}" onclick="correctInstStatus('${offerId}','${instanceId}','${s}')">${STATUS_LABELS[s]}</button>`).join('')}
        </div>
      </div>
      ${inst.redeemDate?`<div class="fg"><label>Redeem date</label>
        <input class="finput" type="date" id="corr-date" value="${inst.redeemDate}" max="${todayStr()}">
        <div class="fhint">Update if the date was entered incorrectly.</div></div>
        <button class="btn btn-s" style="margin-bottom:10px" onclick="correctInstDate('${offerId}','${instanceId}')">Update date</button>`:''}
      <div class="info-box info-em">Changes are saved immediately and reflected across all tabs.</div>
    </div><div style="height:20px"></div>`);
}
function correctInstStatus(offerId,instanceId,newStatus){
  const o=S.offers.find(x=>x.id===offerId);
  const inst=o.instances.find(x=>x.id===instanceId);
  inst.status=newStatus;
  if(newStatus==='available'){inst.redeemDate=null;inst.useByDate=null;inst.notes='';}
  save();closeSheet();render();
}
function correctInstDate(offerId,instanceId){
  const o=S.offers.find(x=>x.id===offerId);
  const inst=o.instances.find(x=>x.id===instanceId);
  const d=document.getElementById('corr-date').value;
  if(!d)return;
  inst.redeemDate=d;
  if(inst.useByDate){
    const[y,m,dy]=d.split('-').map(Number);
    const u=new Date(y,m-1,dy+30);
    inst.useByDate=padDate(u.getFullYear(),u.getMonth()+1,u.getDate());
  }
  save();closeSheet();render();
}

// ── UPCOMING TAB ────────────────────────────────────────────────────────────
function renderUpcoming(){
  const w=S._upcomingWindow||3;
  const activeOffers=S.offers.filter(o=>o.lifecycle==='active');
  const pausedOffers=S.offers.filter(o=>o.lifecycle==='paused');
  const endedOffers=S.offers.filter(o=>o.lifecycle==='ended');

  // Build list: for each active offer, generate all future cycle resets within window
  const rows=[];
  activeOffers.forEach(o=>{
    const card=S.cards.find(c=>c.id===o.cardId);
    const futureStarts=futureCycleStarts(o.cycle,w);
    futureStarts.forEach(start=>{
      const end=cycleEndFor(o.cycle,start);
      const lbl=cycleLabel(o.cycle,start);
      const days=daysUntil(start);
      rows.push({o,card,resetDate:start,cycleEnd:end,lbl,days});
    });
    // Also show current cycle if already redeemed/used/sold (it's "not available" — show next reset)
    const inst=getCurrentInstance(o);
    if(inst&&inst.status!=='available'){
      const nextReset=getNextResetDate(o);
      const days=daysUntil(nextReset);
      // Already included via futureCycleStarts starting from cycleEnd — skip duplicate
    }
  });

  // Sort by reset date
  rows.sort((a,b)=>new Date(a.resetDate)-new Date(b.resetDate));

  // Group by month
  const byMonth={};
  rows.forEach(row=>{
    const[y,m]=row.resetDate.split('-').map(Number);
    const key=new Date(y,m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});
    if(!byMonth[key])byMonth[key]=[];
    byMonth[key].push(row);
  });

  const cycleBadge=v=>v===3?'cy-q':v===6?'cy-h':v===12?'cy-y':'cy-m';
  const cycleShort=v=>v===3?'Quarterly':v===6?'Half-yearly':v===12?'Yearly':'Monthly';

  const tlHTML=Object.entries(byMonth).map(([month,rowList])=>`
    <div class="tl-group">
      <div class="tl-month">${month}</div>
      ${rowList.map(({o,card,resetDate,lbl,days})=>{
        const ci=cat(o.cat);
        const isSoon=days!==null&&days<=7&&days>=0;
        const inst=getCurrentInstance(o);
        const curStatus=inst?inst.status:'available';
        // For current cycle row (resetDate = current cycle's end = next reset)
        const isCurrentNextReset=(resetDate===getNextResetDate(o));
        return`<div class="tl-item${isSoon?' tl-soon':''}" onclick="openOfferDetail('${o.id}')">
          <div class="tl-ic">${ci.e}</div>
          <div class="tl-info">
            <div class="tl-name">${o.name}</div>
            <div class="tl-card">${card?.bank||''}</div>
            <div class="tl-status">
              ${isCurrentNextReset&&curStatus!=='available'?`<span class="chip chip-${curStatus}" style="font-size:9px">${STATUS_LABELS[curStatus]} this cycle</span>`:''}
            </div>
          </div>
          <div class="tl-right">
            <div class="tl-cycle-badge ${cycleBadge(o.cycle)}">${cycleShort(o.cycle)}</div>
            <div class="tl-days${isSoon?' soon':''}">${days===0?'Resets today!':days===1?'Tomorrow':days<0?'Resetting…':`In ${days}d`}</div>
            <div style="font-size:9px;color:var(--t3);margin-top:1px">${fmtD(resetDate)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');

  const pausedHTML=pausedOffers.length?`
    <div class="slabel" style="padding-top:4px">Paused by bank</div>
    <div style="padding:0 18px">
      ${pausedOffers.map(o=>{const ci=cat(o.cat);const card=S.cards.find(c=>c.id===o.cardId);return`
        <div class="tl-paused-row" onclick="openOfferDetail('${o.id}')">
          <div class="tl-ic">${ci.e}</div>
          <div class="tl-info"><div class="tl-name">${o.name}</div><div class="tl-card">${card?.bank||''}${o.lcNote?' · '+o.lcNote:''}</div></div>
          <span class="chip chip-paused">Paused</span>
        </div>`}).join('')}
    </div>`:'';

  const endedHTML=endedOffers.length?`
    <div class="slabel" style="padding-top:4px">Discontinued</div>
    <div style="padding:0 18px">
      ${endedOffers.map(o=>{const ci=cat(o.cat);const card=S.cards.find(c=>c.id===o.cardId);return`
        <div class="tl-ended-row" onclick="openOfferDetail('${o.id}')">
          <div class="tl-ic" style="opacity:.5">${ci.e}</div>
          <div class="tl-info"><div class="tl-name">${o.name}</div><div class="tl-card">${card?.bank||''}</div></div>
          <span class="chip chip-ended">Ended</span>
        </div>`}).join('')}
    </div>`:'';

  return`<div class="topbar"><div class="tbar-title">Upcoming <em>Resets</em></div></div>
    <div class="tgl-group" style="margin-bottom:8px">
      <button class="tgl-opt${w===3?' active':''}" onclick="setUpWindow(3)">3 months</button>
      <button class="tgl-opt${w===6?' active':''}" onclick="setUpWindow(6)">6 months</button>
      <button class="tgl-opt${w===12?' active':''}" onclick="setUpWindow(12)">1 year</button>
      <button class="tgl-opt${w===36?' active':''}" onclick="setUpWindow(36)">3 years</button>
    </div>
    <div class="tl-wrap ani">
      ${tlHTML||emptyHTML('📅','Nothing in this window','Add active offers to your cards to track upcoming resets.')}
    </div>
    ${pausedHTML}${endedHTML}
    <div style="height:16px"></div>`;
}
function setUpWindow(w){S._upcomingWindow=w;render();}

// ── OFFER DETAIL SHEET ─────────────────────────────────────────────────────
function openOfferDetail(offerId){
  const o=S.offers.find(x=>x.id===offerId);if(!o)return;
  const card=S.cards.find(c=>c.id===o.cardId);
  const ci=cat(o.cat);
  const inst=getCurrentInstance(o);
  const nextReset=getNextResetDate(o);
  const days=inst&&inst.status==='redeemed'&&inst.useByDate?daysUntil(inst.useByDate):null;
  const pct=days!==null?Math.max(0,Math.min(100,Math.round((days/30)*100))):null;
  const fillCol=days!==null?(days<=3?'#F05252':days<=7?'#F0B429':'#0ECB81'):'#0ECB81';
  const cs=getCurrentCycleStart(o);
  const pastInsts=o.instances.filter(i=>i.cycleStart!==cs).sort((a,b)=>new Date(b.cycleStart)-new Date(a.cycleStart));

  const lcHTML=()=>{
    if(o.lifecycle==='active')return`<div class="lc-ctrl lc-active-ctrl">
      <div class="lc-label" style="color:var(--em)">● Offer Active</div>
      <div class="lc-sub">Recurs ${cycleL(o.cycle).toLowerCase()}. Use if bank changes this.</div>
      <div class="lc-btns">
        <button class="lc-btn lc-btn-pause" onclick="promptLC('${offerId}','paused')">⏸ Pause</button>
        <button class="lc-btn lc-btn-end" onclick="promptLC('${offerId}','ended')">🔴 Discontinue</button>
      </div></div>`;
    if(o.lifecycle==='paused')return`<div class="lc-ctrl lc-paused-ctrl">
      <div class="lc-label" style="color:var(--co)">⏸ Paused${o.lcNote?' — '+o.lcNote:''}</div>
      <div class="lc-sub">No new cycles until resumed. History preserved.</div>
      <div class="lc-btns">
        <button class="lc-btn lc-btn-resume" onclick="setLC('${offerId}','active','')">▶ Resume</button>
        <button class="lc-btn lc-btn-end" onclick="promptLC('${offerId}','ended')">🔴 Discontinue</button>
      </div></div>`;
    return`<div class="lc-ctrl lc-ended-ctrl">
      <div class="lc-label" style="color:var(--t2)">🔴 Discontinued${o.lcNote?' — '+o.lcNote:''}</div>
      <div class="lc-sub">This offer has ended. History preserved below.</div>
      <div class="lc-btns"><button class="lc-btn lc-btn-resume" onclick="setLC('${offerId}','active','')">▶ Reactivate</button></div>
    </div>`;
  };

  openSheet(`
    <div class="sheet-hdr">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px">${ci.e}</span><div class="sheet-title">${o.name}</div></div>
      <button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sbody">
      <div class="mini-card-hdr">
        <div class="mini-dot" style="background:${CARD_GRADS[card?.grad||0].c}"></div>
        <div><div style="font-size:13px;font-weight:700">${card?.bank||''}</div>
        <div style="font-size:11px;color:var(--t2)">${card?.type||''} · ●●●● ${card?.last4||''}</div></div>
      </div>
      ${inst&&inst.status==='redeemed'&&pct!==null?`<div class="dl-bar">
        <div class="dl-label">Time remaining to use this voucher</div>
        <div class="dl-track"><div class="dl-fill" style="width:${pct}%;background:${fillCol}"></div></div>
        <div class="dl-nums"><span>Redeemed</span><span style="font-weight:700;color:${fillCol}">${days} days left</span><span>30 days</span></div>
      </div>`:''}
      <div class="drow"><span class="dkey">Category</span><span class="dval">${ci.e} ${ci.l}</span></div>
      <div class="drow"><span class="dkey">Reset cycle</span><span class="dval">${cycleL(o.cycle)}</span></div>
      <div class="drow"><span class="dkey">Transferable</span><span class="dval" style="color:${o.tradeable?'var(--em)':'var(--t2)'}">${o.tradeable?'Yes — can sell/transfer':'No — personal use only'}</span></div>
      <div class="drow"><span class="dkey">Next reset</span><span class="dval" style="color:var(--vl)">${fmtD(nextReset)}</span></div>
      ${o.lifecycle==='active'&&inst?`
        <div class="div"></div>
        <div style="font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px">Current cycle — ${inst.cycleLabel}</div>
        <div class="drow"><span class="dkey">Status</span><span class="chip chip-${inst.status}">${STATUS_LABELS[inst.status]}</span></div>
        ${inst.redeemDate?`<div class="drow"><span class="dkey">Redeemed on</span><span class="dval">${fmtD(inst.redeemDate)}</span></div>`:''}
        ${inst.useByDate?`<div class="drow"><span class="dkey">Use by</span><span class="dval" style="color:${days!==null&&days<=7?'var(--co)':'inherit'}">${fmtD(inst.useByDate)}</span></div>`:''}
        ${inst.notes?`<div class="drow"><span class="dkey">Notes</span><span class="dval">${inst.notes}</span></div>`:''}
        <div class="btn-gap">
          ${inst.status==='available'?`<button class="btn btn-p" onclick="openRedeemFlow('${offerId}')">🎁 Mark as Redeemed</button>`:''}
          ${inst.status==='redeemed'?`<div class="btn-row">
            <button class="btn btn-p" onclick="markInstStatus('${offerId}','used')">✅ Mark Used</button>
            ${o.tradeable?`<button class="btn btn-s" onclick="markInstStatus('${offerId}','sold')">💸 Mark Sold</button>`:''}
          </div>`:''}
          ${inst.status==='redeemed'||inst.status==='available'?`<button class="btn btn-s" onclick="markInstStatus('${offerId}','skipped')">Skip this cycle</button>`:''}
          ${inst.status!=='available'?`<button class="btn btn-am" onclick="openCorrectStatus('${offerId}','${inst.id}')">✎ Correct status</button>`:''}
        </div>`:''}
      <div class="div"></div>
      ${lcHTML()}
      ${pastInsts.length?`<div class="div"></div>
        <div style="font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px">Past cycles</div>
        ${pastInsts.map(i=>`<div class="hist-item">
          <div><div class="hist-cycle">${i.cycleLabel}</div>
          <div style="font-size:11px;color:var(--t3)">${i.redeemDate?'Redeemed '+fmtD(i.redeemDate):'Not redeemed'}</div></div>
          <div class="hist-right">
            <span class="chip chip-${i.status}" style="cursor:pointer" onclick="openCorrectStatus('${o.id}','${i.id}')">${STATUS_LABELS[i.status]} ✎</span>
          </div></div>`).join('')}`:''}
      <div class="div"></div>
      <button class="btn btn-d" onclick="deleteOffer('${offerId}')">Remove offer</button>
    </div><div style="height:20px"></div>`);
}

// ── REDEEM FLOW ─────────────────────────────────────────────────────────────
function openRedeemFlow(offerId){
  const o=S.offers.find(x=>x.id===offerId);if(!o)return;
  const ci=cat(o.cat);const card=S.cards.find(c=>c.id===o.cardId);
  openSheet(`
    <div class="sheet-hdr"><div class="sheet-title">Redeem Offer</div><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sbody">
      <div class="rdm-hero"><div class="rdm-em">${ci.e}</div>
        <div class="rdm-title">${o.name}</div>
        <div class="rdm-sub">${card?.bank||''} · ${cycleL(o.cycle)} · ${cycleLabel(o.cycle,cycleStartFor(o.cycle))}</div>
      </div>
      <div class="fg"><label>Date redeemed from website</label>
        <input class="finput" type="date" id="rdm-date" value="${todayStr()}" max="${todayStr()}">
        <div class="fhint">Pre-filled with today. Change if you redeemed on a different date.</div>
      </div>
      <div class="info-box info-am">⏱ You have <strong>30 days</strong> from this date to use the voucher balance — unless it's a transferable type that can be moved to a wallet for longer.</div>
      <div class="fg"><label>Notes (optional)</label>
        <input class="finput" type="text" id="rdm-notes" placeholder="e.g. Code ABC123, added to Paytm wallet…"></div>
      <button class="btn btn-p" onclick="confirmRedeem('${offerId}')">Confirm Redemption</button>
    </div><div style="height:20px"></div>`);
}
function confirmRedeem(offerId){
  const dv=document.getElementById('rdm-date').value;
  const notes=document.getElementById('rdm-notes').value;
  if(!dv){alert('Please enter a redeem date');return}
  const o=S.offers.find(x=>x.id===offerId);
  const inst=getCurrentInstance(o);if(!inst)return;
  const[y,m,d]=dv.split('-').map(Number);
  const useByDate=padDate(y,m,d+30<=new Date(y,m,0).getDate()?m:m%12+1,d+30<=new Date(y,m,0).getDate()?d+30:d+30-new Date(y,m,0).getDate());
  // Simpler: add 30 days using local Date arithmetic
  const ubd=new Date(y,m-1,d+30);
  inst.status='redeemed';inst.redeemDate=dv;inst.notes=notes;
  inst.useByDate=padDate(ubd.getFullYear(),ubd.getMonth()+1,ubd.getDate());
  save();closeSheet();render();
}
function markInstStatus(offerId,newStatus){
  const o=S.offers.find(x=>x.id===offerId);if(!o)return;
  const inst=getCurrentInstance(o);if(!inst)return;
  inst.status=newStatus;save();closeSheet();render();
}

// ── LIFECYCLE ──────────────────────────────────────────────────────────────
function promptLC(offerId,newLC){
  const msg=newLC==='paused'?'Reason (optional): e.g. "Bank suspended Q4 2026"':'Reason (optional): e.g. "Discontinued Oct 2026"';
  const note=prompt(msg)||'';setLC(offerId,newLC,note);
}
function setLC(offerId,newLC,note){
  const o=S.offers.find(x=>x.id===offerId);if(!o)return;
  o.lifecycle=newLC;o.lcNote=note||'';
  if(newLC==='active')ensureCurrentInstance(o);
  save();closeSheet();render();
}

function setRedFilter(sf){
  document.querySelectorAll('.tgl-opt').forEach(b=>b.classList.toggle('active',b.dataset.sf===sf));

// ── DELETE ─────────────────────────────────────────────────────────────────
function deleteOffer(id){if(!confirm('Remove this offer and all its history?'))return;S.offers=S.offers.filter(o=>o.id!==id);save();closeSheet();render();}
function deleteCard(id){if(!confirm('Remove this card and ALL its offers?'))return;S.cards=S.cards.filter(c=>c.id!==id);S.offers=S.offers.filter(o=>o.cardId!==id);save();closeSheet();render();}

// ── EXPORT / IMPORT ────────────────────────────────────────────────────────
function toggleMenu(){document.getElementById('logo-menu').classList.toggle('open');}
function closeMenu(){document.getElementById('logo-menu').classList.remove('open');}

function exportData(){
  closeMenu();
  const data={version:3,exportedAt:new Date().toISOString(),cards:S.cards,offers:S.offers};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;a.download=`vaultcard-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();URL.revokeObjectURL(url);
}
function triggerImport(){closeMenu();document.getElementById('import-file').click();}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.cards||!data.offers){alert('Invalid backup file');return}
      if(!confirm(`This will replace all your current data with the backup from ${data.exportedAt?new Date(data.exportedAt).toLocaleDateString('en-IN'):'unknown date'}.\n\nContinue?`))return;
      S.cards=data.cards;S.offers=data.offers;
      S.offers.forEach(o=>ensureCurrentInstance(o));
      save();render();
      alert('✅ Data restored successfully!');
    }catch(err){alert('Could not read backup file. Make sure it is a valid VaultCard backup.');}
  };
  r.readAsText(file);
  e.target.value='';
}

// ── SHEET / NAV ────────────────────────────────────────────────────────────
function openSheet(html){document.getElementById('shc').innerHTML=html;document.getElementById('ov').classList.add('open');}
function closeSheet(e){if(!e||e.target===document.getElementById('ov'))document.getElementById('ov').classList.remove('open');}
function switchTab(tab){S.tab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));closeMenu();render();}
function emptyHTML(ic,t,s){return`<div class="empty"><div class="ei">${ic}</div><div class="et">${t}</div><div class="es">${s}</div></div>`;}

function padDate(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

// FIX #4: must call load() here, not render() — load() syncs cloud then calls render()
load();
</script>
